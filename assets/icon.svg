<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Three clusters together">
  <title>Fleet of clusters</title>
  <!--
    Three cluster wheels overlapping: one cluster in front, two behind it, a fleet. Each has a
    dark outline, so the group reads on light and dark backgrounds alike, down to 16 pixels.
  -->
