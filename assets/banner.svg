<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="Six clusters side by side, each with its own colour and status">
  <title>Fleet Overview for Lens</title>
  <!--
    A fleet: six cluster cards laid out together, each with its cluster wheel, a status dot and
    resource bars, under the extension's name. The banner is cropped to whatever shape it is
    shown in, so everything keeps a margin from the edges.
  -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#252c3a"/>
      <stop offset="1" stop-color="#171c26"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3d90ce" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3d90ce" stop-opacity="0"/>
    </radialGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="800" height="400" fill="url(#ground)"/>
  <ellipse cx="400" cy="230" rx="360" ry="190" fill="url(#glow)"/>
  <text x="400" y="100" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#ffffff" letter-spacing="-0.5">Fleet Overview</text>

